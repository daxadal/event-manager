name: deploy

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest
  IMAGE_AMD: ghcr.io/${{ github.repository }}:amd64
  IMAGE_ARM: ghcr.io/${{ github.repository }}:arm64

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            tag: $IMAGE_AMD
          - platform: linux/arm64
            architecture: arm64
            tag: $IMAGE_ARM
    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Docker login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push ${{ matrix.architecture }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ matrix.tag }}

  publish-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Docker login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Publish multi-architecture image"
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE" \
            "$IMAGE_AMD" \
            "$IMAGE_ARM"

      - name: "Setup SSH"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: "Copy production .env file"
        env:
          USER: ${{ secrets.DEPLOY_USER }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          echo ${{ secrets.DOTENV_PROD }} >> prod.env
          scp prod.env "$USER@$HOST:~/dax-apps/env/$NAME.env"

      - name: Deploy on Oracle Linux
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: SERVICE=${{ github.event.repository.name }} ~/dax-apps/deploy.sh
