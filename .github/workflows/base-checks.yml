name: Base checks

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: "Install dependencies"
        run: npm ci

      - name: "Build"
        run: npm run tscç

      - name: "Upload compiled files"
        uses: actions/upload-artifact@v6
        with:
          name: compiled
          path: |
            dist/
            node-modules/

  test:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "6.0.6"

      - name: "Download compiled files"
        uses: actions/download-artifact@v6
        with:
          name: compiled

      - name: "Test"
        run: |
          cat > test.env <<EOF
          ${{ secrets.DOTENV_JEST }}
          EOF
          npm test

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: logs
          path: logs/

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-results
          path: junit.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: "Lint"
        run: npm run lint

  build:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - architecture: amd64
          - architecture: arm64
    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: "Download compiled files"
        uses: actions/download-artifact@v6
        with:
          name: compiled

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Docker login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push ${{ matrix.architecture }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.architecture }}
          tags: ghcr.io/${{ github.repository }}:${{ matrix.architecture }}

  publish-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Docker login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Publish multi-architecture image"
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
                  "ghcr.io/${{ github.repository }}:amd64" \
                  "ghcr.io/${{ github.repository }}:arm64"

      - name: "Setup SSH"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: "Copy production .env file"
        env:
          USER: ${{ secrets.DEPLOY_USER }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          cat > prod.env <<EOF
          ${{ secrets.DOTENV_PROD }}
          EOF

          scp prod.env "$USER@$HOST:~/dax-apps/env/$NAME.env"

      - name: Deploy on Oracle Linux
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: SERVICE=${{ github.event.repository.name }} ~/dax-apps/deploy.sh
