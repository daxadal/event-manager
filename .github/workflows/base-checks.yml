name: Base checks
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  base-checks:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: '6.0.6'

      - name: "Install dependencies"
        run: npm ci

      - name: "Build"
        run: npm run tsc

      - name: "Test"
        run: |
          echo $DOTENV_JEST >> test.env
          npm test

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-results
          path: junit.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: "Lint"
        run: npm run lint
